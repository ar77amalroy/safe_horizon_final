<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Safe Horizon | Partner Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Segoe+UI:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        @keyframes floatDiagonal {
            0% {
                transform: translate(40%, -40%) rotate(-30deg);
            }

            50% {
                transform: translate(-40%, 40%) rotate(-30deg);
            }

            100% {
                transform: translate(40%, -40%) rotate(-30deg);
            }
        }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: #f0f9ff;
            height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            width: 140vmax;
            height: 140vmax;
            top: 50%;
            left: 50%;
            margin-top: -70vmax;
            margin-left: -70vmax;
            background: linear-gradient(135deg,
                    rgba(103, 232, 249, 0.4) 0%,
                    rgba(6, 182, 212, 0.4) 30%,
                    rgba(165, 243, 252, 0.4) 50%,
                    rgba(34, 211, 238, 0.35) 70%,
                    transparent 100%);
            border-radius: 40px;
            animation: floatDiagonal 18s ease-in-out infinite;
            z-index: 0;
            pointer-events: none;
            filter: blur(60px);
        }

        .login-card {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            padding: 2.5rem;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.45);
            width: 100%;
            max-width: 400px;
            text-align: center;
            position: relative;
            z-index: 1;
        }

        .logo-area {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            color: #0e7490;
            margin-bottom: 1.5rem;
        }

        .logo-area h1 {
            margin: 0;
            font-size: 1.5rem;
        }

        p.subtitle {
            color: #64748b;
            font-size: 0.95rem;
            margin-bottom: 2rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
            text-align: left;
        }

        .form-label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: #475569;
            margin-bottom: 6px;
        }

        .form-control {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            border: 1px solid rgba(203, 213, 225, 0.6);
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(6px);
            transition: all 0.25s ease;
            font-family: 'Inter', system-ui, sans-serif;
        }

        .form-control:focus {
            border-color: #06b6d4;
            box-shadow: 0 0 0 3px rgba(6, 182, 212, 0.2);
            background: rgba(255, 255, 255, 0.75);
        }

        .btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #06b6d4, #0891b2);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 4px 14px rgba(6, 182, 212, 0.3);
            font-family: 'Inter', system-ui, sans-serif;
        }

        .btn:hover {
            background: linear-gradient(135deg, #0891b2, #0e7490);
            box-shadow: 0 6px 20px rgba(6, 182, 212, 0.45);
            transform: translateY(-1px);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        /* Hide the OTP section initially */
        #otpSection {
            display: none;
        }
    </style>
</head>

<body>

    <div class="login-card">
        <div class="logo-area">
            <img src="/assets/images/logo.png" alt="Safe Horizon Logo"
                style="width: 50px; height: 50px; object-fit: contain;">
            <h1>Partner Portal</h1>
        </div>
        <p class="subtitle" id="instructionText">Enter your official registered email to receive a one-time login code.
        </p>

        <div id="emailSection">
            <div class="form-group">
                <label class="form-label">Official Authority Email</label>
                <input type="email" id="emailInput" class="form-control" placeholder="e.g., dispatch@police.gov"
                    required>
            </div>
            <button class="btn" id="sendOtpBtn" onclick="requestOTP()">Send Login Code</button>
        </div>

        <div id="otpSection">
            <div class="form-group">
                <label class="form-label">6-Digit OTP</label>
                <input type="text" id="otpInput" class="form-control" placeholder="123456" maxlength="6"
                    style="letter-spacing: 4px; font-size: 1.2rem; text-align: center;">
            </div>
            <button class="btn" id="verifyOtpBtn" onclick="verifyOTP()">Secure Login</button>
            <button class="btn" style="background: transparent; color: #1976d2; margin-top: 10px; font-size: 0.85rem;"
                onclick="location.reload()">Use a different email</button>
        </div>
    </div>

    <script>
        // ☁️ CLOUD URL (Render) - Comment this out for now
        const API_BASE_URL = 'https://safe-horizon-backend.onrender.com';

        // 💻 LOCAL URL (Mobile Hotspot)
        //const API_BASE_URL = 'http://10.197.96.244:8000';
        let userEmail = '';

        async function requestOTP() {
            const email = document.getElementById('emailInput').value;
            if (!email) { alert("Please enter your email."); return; }

            const btn = document.getElementById('sendOtpBtn');
            btn.innerText = "Sending..."; btn.disabled = true;

            try {
                // Use POST and pass email as a query parameter
                const res = await fetch(`${API_BASE_URL}/partner/request-otp?email=${encodeURIComponent(email)}`, { method: 'POST' });
                const data = await res.json();

                if (res.ok) {
                    userEmail = email; // Save it for step 2
                    document.getElementById('emailSection').style.display = 'none';
                    document.getElementById('otpSection').style.display = 'block';
                    
                    if (data.otp) {
                        // Email couldn't be sent (Render SMTP blocked) — show OTP directly
                        document.getElementById('otpInput').value = data.otp;
                        document.getElementById('instructionText').innerHTML = `<b style="color:#0e7490;">Your OTP code: ${data.otp}</b><br><span style="font-size:0.85rem;color:#64748b;">(Email service unavailable — code shown here instead)</span>`;
                    } else {
                        document.getElementById('instructionText').innerHTML = `We sent a 6-digit code to <b>${email}</b>.`;
                    }
                } else {
                    alert(data.detail || "Error sending OTP.");
                    btn.innerText = "Send Login Code"; btn.disabled = false;
                }
            } catch (err) {
                alert("Network error. Is the backend running?");
                btn.innerText = "Send Login Code"; btn.disabled = false;
            }
        }

        async function verifyOTP() {
            const otp = document.getElementById('otpInput').value;
            if (otp.length !== 6) { alert("Please enter a valid 6-digit code."); return; }

            const btn = document.getElementById('verifyOtpBtn');
            btn.innerText = "Verifying..."; btn.disabled = true;

            try {
                const res = await fetch(`${API_BASE_URL}/partner/verify-otp?email=${encodeURIComponent(userEmail)}&otp=${encodeURIComponent(otp)}`, { method: 'POST' });
                const data = await res.json();

                if (res.ok) {
                    // Save partner info to localStorage so the dashboard knows who is logged in
                    localStorage.setItem("partnerSession", JSON.stringify({
                        id: data.partner_id,
                        name: data.partner_name,
                        type: data.partner_type
                    }));

                    // Redirect to the actual dashboard
                    window.location.href = "/partner-dashboard";
                } else {
                    alert(data.detail || "Invalid or expired OTP.");
                    btn.innerText = "Secure Login"; btn.disabled = false;
                }
            } catch (err) {
                alert("Network error.");
                btn.innerText = "Secure Login"; btn.disabled = false;
            }
        }
    </script>
</body>

</html>
