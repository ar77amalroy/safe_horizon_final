<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Safe Horizon | Authority Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Segoe+UI:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        @keyframes floatDiagonal {
            0% {
                transform: translate(40%, -40%) rotate(-30deg);
            }

            50% {
                transform: translate(-40%, 40%) rotate(-30deg);
            }

            100% {
                transform: translate(40%, -40%) rotate(-30deg);
            }
        }

        :root {
            font-family: 'Inter', system-ui, sans-serif;
            color: #1e293b;
            margin: 0;
            min-height: 100vh;
        }

        body {
            margin: 0;
            background: #f0f9ff;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            width: 140vmax;
            height: 140vmax;
            top: 50%;
            left: 50%;
            margin-top: -70vmax;
            margin-left: -70vmax;
            background: linear-gradient(135deg,
                    rgba(103, 232, 249, 0.4) 0%,
                    rgba(6, 182, 212, 0.4) 30%,
                    rgba(165, 243, 252, 0.4) 50%,
                    rgba(34, 211, 238, 0.35) 70%,
                    transparent 100%);
            border-radius: 40px;
            animation: floatDiagonal 18s ease-in-out infinite;
            z-index: 0;
            pointer-events: none;
            filter: blur(60px);
        }

        .header {
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            color: #1e293b;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
            position: relative;
            z-index: 10;
        }

        .main {
            padding: 2rem;
            max-width: 1000px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        .panel {
            background: rgba(255, 255, 255, 0.55);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border-radius: 14px;
            padding: 1.5rem;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.4);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
        }

        th,
        td {
            padding: 1rem;
            border-bottom: 1px solid rgba(226, 232, 240, 0.6);
            text-align: left;
        }

        th {
            background: rgba(240, 249, 255, 0.6);
            color: #475569;
            font-weight: 600;
        }

        .btn {
            padding: 0.5rem 1rem;
            border-radius: 6px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            color: white;
            transition: all 0.25s ease;
            font-family: 'Inter', system-ui, sans-serif;
        }

        .btn-success {
            background: linear-gradient(135deg, #06b6d4, #0891b2);
            box-shadow: 0 3px 10px rgba(6, 182, 212, 0.25);
        }

        .btn-success:hover {
            box-shadow: 0 5px 16px rgba(6, 182, 212, 0.4);
            transform: translateY(-1px);
        }

        .btn-danger {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            box-shadow: 0 3px 10px rgba(239, 68, 68, 0.2);
        }

        .btn-danger:hover {
            box-shadow: 0 5px 16px rgba(239, 68, 68, 0.35);
            transform: translateY(-1px);
        }

        .status-badge {
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: bold;
        }

        .status-assigned {
            background: rgba(255, 243, 224, 0.8);
            color: #ef6c00;
        }

        .status-resolved {
            background: rgba(232, 245, 233, 0.8);
            color: #2e7d32;
        }
    </style>
</head>

<body>

    <div class="header">
        <h2 style="margin: 0; display: flex; align-items: center; gap: 10px;">
            <span class="material-icons">local_police</span> Partner Authority Portal
        </h2>
        <div>
            <label>Testing as Authority ID: </label>
            <input type="number" id="authIdInput" value="1" style="width: 50px; padding: 4px;">
            <button onclick="loadAssignedCases()" style="padding: 4px 8px;">Load Cases</button>
        </div>
    </div>

    <div class="main">
        <div class="panel">
            <h3>Cases Assigned for Verification</h3>
            <p style="color: #546e7a;">Please verify the following incidents reported in your jurisdiction.</p>
            <table>
                <thead>
                    <tr>
                        <th>Case ID</th>
                        <th>Time</th>
                        <th>Location & Details</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="cases-table-body">
                    <tr>
                        <td colspan="5" style="text-align: center;">Click 'Load Cases' to fetch your assignments.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const API_BASE_URL = 'https://safe-horizon-backend.onrender.com';

        async function loadAssignedCases() {
            const authId = document.getElementById('authIdInput').value;
            const tableBody = document.getElementById('cases-table-body');
            tableBody.innerHTML = '<tr><td colspan="5" style="text-align: center;">Loading...</td></tr>';

            try {
                const response = await fetch(`${API_BASE_URL}/authority/${authId}/cases`);
                if (!response.ok) throw new Error("Failed");
                const cases = await response.json();

                if (cases.length === 0) {
                    tableBody.innerHTML = '<tr><td colspan="5" style="text-align: center;">No cases assigned to you currently.</td></tr>'; return;
                }

                tableBody.innerHTML = '';
                cases.forEach(c => {
                    const isPending = c.status === 'assigned_to_auth';
                    const badgeClass = isPending ? 'status-assigned' : 'status-resolved';
                    const statusText = isPending ? 'Needs Verification' : 'Resolved';

                    tableBody.innerHTML += `
                        <tr>
                            <td><strong>#${c.id}</strong></td><td>${c.reported_at}</td>
                            <td>Lat: ${c.latitude.toFixed(4)}, Lng: ${c.longitude.toFixed(4)}<br><small>${c.severity} Severity</small></td>
                            <td><span class="status-badge ${badgeClass}">${statusText}</span></td>
                            <td>
                                ${isPending ? `
                                    <button class="btn btn-success" onclick="verifyCase(${c.id}, 'approve')">Confirm Accident</button>
                                    <button class="btn btn-danger" onclick="verifyCase(${c.id}, 'reject')">Fake Report</button>
                                ` : '<span style="color: gray;">Verification Complete</span>'}
                            </td>
                        </tr>
                    `;
                });
            } catch (err) { tableBody.innerHTML = '<tr><td colspan="5" style="text-align: center; color: red;">Error loading cases.</td></tr>'; }
        }

        async function verifyCase(reportId, action) {
            if (!confirm(`Are you sure you want to mark this case as ${action}?`)) return;
            try {
                const response = await fetch(`${API_BASE_URL}/authority/verify/${reportId}/${action}`, { method: 'PUT' });
                if (response.ok) loadAssignedCases(); else alert("Failed to verify.");
            } catch (err) { alert("Network error."); }
        }
    </script>
</body>

</html>
